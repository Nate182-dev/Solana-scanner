<style>
:root{color-scheme:dark;--bg:#07090d;--p:#0e1218;--p2:#141b24;--line:#1d2632;--text:#e8edf4;--mut:#8896a9;--blue:#4f7cff;--g:#2ee6a6;--a:#f5b942;--r:#ff5c70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(7,9,13,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}.logo{width:20px;height:20px;border-radius:50%;border:2px solid var(--blue);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 5px var(--g)}
.sub{color:var(--mut);font-size:11px}.stat{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.04em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.g{background:var(--g)}.dot.a{background:var(--a)}.dot.r{background:var(--r)}
#bar{padding:6px 14px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line)}
main{max-width:720px;margin:0 auto;padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip,.chips button{flex:none;background:var(--p2);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px}.chip b{color:var(--text)}
.chips button.on{color:var(--text);border-color:var(--blue);background:rgba(79,124,255,.16)}
.row{display:flex;gap:10px;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}.row:active{background:var(--p2)}
.av{width:44px;height:44px;flex:none;border-radius:12px;overflow:hidden;background:var(--p2);display:flex;align-items:center;justify-content:center}.av.big{width:60px;height:60px;border-radius:16px}
.av-img{width:100%;height:100%;object-fit:cover}.av-fb{font-weight:700;color:var(--blue);font-size:18px}
.mid{flex:1;min-width:0}.t1{display:flex;gap:6px;align-items:baseline}.t1 b{font-size:15px}.big{font-size:20px!important}
.nm{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.age{margin-left:auto;color:var(--mut);font-size:11px;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--mut);font-size:11px;margin:3px 0}.stats b{color:var(--text);font-weight:600}
.pills{display:flex;gap:5px;flex-wrap:wrap}.sp{margin:8px 0}
.pill{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.g{color:var(--g);border-color:rgba(46,230,166,.45)}.pill.a{color:var(--a);border-color:rgba(245,185,66,.45)}.pill.r{color:var(--r);border-color:rgba(255,92,112,.5)}.pill.b{color:var(--blue);border-color:rgba(79,124,255,.5)}
.warn{color:var(--mut);font-size:11px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(14,18,24,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 0;font-weight:600}nav button.on{color:var(--text);box-shadow:inset 0 2px 0 var(--blue)}
#detail{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));max-width:100%}
.hd{display:flex;justify-content:space-between;align-items:center}.back{background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.card.top{display:flex;gap:12px;align-items:center}
.card.ex{border-color:rgba(255,92,112,.5)}.card.ex b{color:var(--r)}.h{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}.card>.h:first-child{margin-top:0}
p{margin:4px 0}.note{color:var(--mut);font-size:12px}.copy{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--mut);margin-top:4px}
.ct{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.ct b{color:var(--text)}.cv{width:100%;height:90px;margin:6px 0;display:block}.cr{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.chart{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.cf{width:100%;height:340px;border:0;border-radius:10px;margin-top:10px;background:var(--p2)}
.btn{display:inline-block;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--text);text-align:center}.links{display:flex;flex-wrap:wrap;gap:8px}
.ln{display:flex;justify-content:space-between;gap:10px}.meter{height:6px;background:var(--p2);border-radius:3px;overflow:hidden;margin:4px 0}.meter i{display:block;height:100%;background:var(--blue)}.meter.na{background:repeating-linear-gradient(45deg,var(--p2),var(--p2) 4px,var(--line) 4px,var(--line) 8px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.grid div span{display:block;color:var(--mut);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}.scroll{overflow-x:auto}
</style></head><body>
<header><div class="brand"><span class="logo"></span><b>SCANNER</b><span class="sub">Solana · read-only</span></div><div class="stat"><span id="dot" class="dot"></span><b id="st">…</b></div></header>
<div id="bar"><span id="stsub">Loading…</span></div>
<main>
<section id="v-tokens"><div id="chips" class="chips"></div>
<div id="sorts" class="chips"><button data-sort="seen" class="on">Newest</button><button data-sort="score">Score</button><button data-sort="risk">Lowest risk</button><button data-sort="liq">Liquidity</button><button data-hide="1">Hide Avoid</button></div>
<div id="list"></div></section>
<section id="v-alerts" hidden></section><section id="v-paper" hidden></section>
</main>
<nav id="tabs"><button data-tab="tokens" id="tab-tokens" class="on">Tokens</button><button data-tab="alerts" id="tab-alerts">Alerts</button><button data-tab="paper" id="tab-paper">Paper</button></nav>
<div id="detail" hidden></div>
<script src="/app.js"></script></body></html>
