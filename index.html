<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#0b0f14"><link rel="manifest" href="/manifest.webmanifest"><title>Solana Scanner</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e6edf3;font:15px/1.45 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto}h1{font-size:20px;margin:14px 0 8px}
#status{padding:10px;border:2px solid #3b4654;border-radius:8px;margin-bottom:10px}#status.bad{border-style:dashed;border-color:#f0883e}
.bar{display:flex;gap:8px;margin-bottom:10px}select,button{flex:1;background:#161b22;color:inherit;border:1px solid #3b4654;border-radius:8px;padding:10px;font:inherit}
article{background:#121820;border:1px solid #2a3340;border-radius:10px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}.rec{font-size:12px;border:1px solid #6e7b8b;border-radius:6px;padding:2px 6px;white-space:nowrap}
p{margin:4px 0}.addr{font-size:11px;color:#8b98a5;word-break:break-all}.warn::before{content:"⚠ "}details{margin-top:6px}summary{padding:6px 0}
.note{font-size:12px;color:#8b98a5}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #2a3340;padding:4px;text-align:left}
</style></head><body><main>
<h1>Solana Scanner</h1><p class="note">Research aid only. Never trades, never asks for a wallet. Not financial advice.</p>
<div id="status">Loading…</div>
<div class="bar"><select id="sort"><option value="seen">Newest first</option><option value="score">Strongest signals</option><option value="risk">Lowest risk</option><option value="liq">Highest liquidity</option></select>
<button id="hide">Hide AVOID</button></div>
<h1>Paper performance</h1><div id="paper"></div><h1>Recent alerts</h1><div id="alerts"></div><h1>Tokens</h1><div id="list"></div></main><script src="/app.js"></script></body></html>
